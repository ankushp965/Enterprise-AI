version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: enterprise-ai-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - port=8000
    volumes:
      - ./logs:/app/logs
      - ./chromadb_db:/app/chromadb_db
    networks:
      - app-network
    depends_on:
      - phoenix

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: enterprise-ai-frontend
    restart: unless-stopped
    networks:
      - app-network

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: enterprise-ai-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"
    volumes:
      - ./phoenix_data:/workspace/phoenix_data
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: enterprise-ai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend
      - frontend
      - phoenix

    networks:
      - app-network

networks:
  app-network:
    driver: bridge
