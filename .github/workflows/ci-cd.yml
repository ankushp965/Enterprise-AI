name: Enterprise AI DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ===============================================================
  # STAGE 1: Code Quality & SAST (Static Application Security Testing)
  # ===============================================================
  sast-and-lint:
    name: 🛡️ SAST & Code Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python SAST Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit

      - name: Run Python Linter (Flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv

      - name: Run SAST Security Scan (Bandit)
        run: |
          # Scans Python code for security issues (injection, hardcoded passwords, etc.)
          bandit -r app/ agents/ guardrails/ -ll -ii

      - name: Set up Node.js for Frontend SAST
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run Frontend Lint & SAST
        run: |
          cd frontend
          npm ci
          npm run lint || true

  # ===============================================================
  # STAGE 2: SCA (Software Composition Analysis)
  # ===============================================================
  sca-dependency-scan:
    name: 🔍 SCA Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: sast-and-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python SCA (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

      - name: Run Frontend SCA (npm audit)
        run: |
          cd frontend
          npm audit --audit-level=high || true

  # ===============================================================
  # STAGE 3: Docker Build & Container Image Security (Trivy)
  # ===============================================================
  docker-build-and-scan:
    name: 🐳 Docker Build & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: sca-dependency-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t enterprise-ai-backend:${{ github.sha }} -f docker/Dockerfile.backend .

      - name: Build Frontend Docker Image
        run: |
          docker build -t enterprise-ai-frontend:${{ github.sha }} -f docker/Dockerfile.frontend .

      - name: Run Trivy Vulnerability Scanner on Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-ai-backend:${{ github.sha }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  # ===============================================================
  # STAGE 4: DAST (Dynamic Application Security Testing - OWASP ZAP)
  # ===============================================================
  dast-scan:
    name: ⚡ DAST Security Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: docker-build-and-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Mock Environment for Live Testing
        run: |
          echo "PORT=8000" >> .env
          echo "OPENROUTER_API_KEY=mock-test-key" >> .env

      - name: Start Full Application Stack via Docker Compose
        run: |
          docker compose up -d --build
          # Wait 15 seconds for services to fully initialize
          sleep 15

      - name: Verify Services are Healthy
        run: |
          curl -I http://localhost:80/ || exit 1

      - name: Run OWASP ZAP Baseline DAST Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:80/"
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: false

      - name: Stop Application Stack
        if: always()
        run: |
          docker compose down

  # ===============================================================
  # STAGE 5: Continuous Deployment (CD to AWS EC2)
  # ===============================================================
  deploy-to-ec2:
    name: 🚀 Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: dast-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        if: env.EC2_HOST != ''
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/enterprise-ai
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker image prune -f